<!--Html es el lenguaje de marcado estandar para crear paginas web-->

<!-- ===================================
=               Que es HTML             =
==================================== -->
<!--HTML significa HyperText Markup Language (Lenguaje de Marcado de Hipertexto)-->
<!--HTML describe la estructura en una pagina web y consta de una serie de elementos -->
<!--Los elementos en HTML le dicen al navegador como mostrar el contenido-->
<!--Los elementos HTML etiquetan fragmentos de contenido como "Este es un encabezado", "Este es un párrafo", etc-->

<!-- ===================================
=               Documento HTML sencillo                =
==================================== -->

<!DOCTYPE html>
<!--Esta etiqueta declara que este fragmento de código corresponde a un documento HTML5-->
<html lang="es">
    <!--La etiqueta <html> es el elemento raíz de un documento HTML-->
<head>
    <!--Etiqueta que contiene metadatos sobre el documento HTML-->
    <title>Mi primera página</title>
    <!--Etiqueta que define el titulo de una página y se muestra en la pwstaña del navegador-->
</head>
<body>
    <!--Etiqueta que contiene el contenido visible de una página-->
    <h1>Mi primer título</h1>
    <!--Etiqueta que define el título de una página-->
    <p>Este es mi primer párrafo.</p>
    <!--Etiqueta que define un párrafo-->
</body>
</html>

<!-- ===================================
=               Elemento o etiqueta HTML                =
==================================== -->

<!--Un elemento se define por una etiqeuta de inicio el contenido de esta y la etiqueta de cierre-->
<!-- <nombre_etiqueta>contenido</nombre_etiqueta> -->

<!--El elemento HTML es todo tanto la etiqqueta como su contenido-->

<!-- ===================================
=               Navegadores web                =
==================================== -->

<!--El propósito de un navegador es interpretar las etiquetas HTML correctamente y mostrar su contenido (No muestra las etiquetas explicitamente pero si las usa para fines de saber que tipo de contenido mostrar (titulos, párrafos, etc))-->
