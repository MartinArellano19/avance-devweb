<!-- ===================================
=               Documento HTML                =
==================================== -->
<!--Todo documento HTML debe comenzar con <!DOCTYPE html> (Todo el documento comienza con <html> y cierra con </html>) -->
<!--La parte visible del documento comienza y cierra con la etiqueta <body></body>-->

<!-- ===================================
=               Ejemplo                =
==================================== -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Mi primer título</h1>
    <p>Este es mi primer párrafo.</p>
</body>
</html>

<!-- ===================================
=               Etiqueta <!DOCTYPE>                =
==================================== -->

<!--Esta etiqueta ayuda a mostrar a los navegadores a mostrar la página web correctamente y a su vez dicha etiqueta define el tipo de documento que se está utilizando-->

<!--La declaracion <!DOCTYPE> no define entre mayúsculas y minúsculas-->
<!--<!DOCTYPE html> (así es la sintaxis)-->

<!-- ===================================
=               Encabezados HTML                =
==================================== -->

<!--se definen con la etiqueta <h1> hasta <h6> dependiendo del nivel de importancia que se quiera dar al encabezado siendo h1 el más importante y h6 el menos importante-->

<h1>Encabezado de nivel 1</h1> <!--Encabezado mas "importante"-->
<h2>Encabezado de nivel 2</h2>
<h3>Encabezado de nivel 3</h3>
<h4>Encabezado de nivel 4</h4>
<h5>Encabezado de nivel 5</h5>
<h6>Encabezado de nivel 6</h6> <!--Encabezado menos "importante"-->

<!-- ===================================
=               Párrafos HTML                =
==================================== -->

<!--Los párrafos se definen con la etiqueta <p> y se cierran con </p>-->
<p>Este es un párrafo de ejemplo.</p>

<!-- ===================================
=               Enlaces HTML                 =
==================================== -->

<!--Los enlaces se definen con la etiqueta <a> y se cierran con </a>-->
<a href="https://www.w3schools.com/">Visita w3schools</a>
