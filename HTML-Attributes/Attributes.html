<!--Los atributos en HTML proporcionan información adicional sobre los elementos  y todas las etiquetas pueden tener atributos-->

<!--siempre se escriben dentro de la etiqueta de inicio-->

<!--Generalmente vienen en pares nombre/valor nombre="valor"-->

<!-- ===================================
=               Atributo href                =
==================================== -->

<!--Con la etiqueta <a> se define un link y el atributo href especifica la dirección a la que apunta el link-->

<a href="https://www.google.com">Visita Google</a>

<!-- ===================================
=               Atributo src                =
==================================== -->

<!--Con la etiqueta <img> se define una imagen y el atributo src especifica la ruta de la imagen-->

<img src="imagen.jpg">
